name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs third-party npm code, so it only gets read access.
# Publishing permissions are granted to the deploy job alone.
permissions:
  contents: read

# Never cancel a deployment that is already running; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps the pins up to date.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build, check and upload site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          # A failing check (missing store URL, external resource, broken link) stops the deploy.
          build-cmd: npm run build && npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
