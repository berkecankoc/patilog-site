name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs third-party npm code, so it only gets read access.
# Publishing permissions are granted to the deploy job alone.
permissions:
  contents: read

# Never cancel a deployment that is already running; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, check and upload site
        uses: withastro/action@v6
        with:
          # A failing check (missing store URL, external resource, broken link) stops the deploy.
          build-cmd: npm run build && npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
